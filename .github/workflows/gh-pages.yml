# Publishes demo/ to GitHub Pages on every push to main that touches it.
#
# Mirrors killerwolf/visual-image-tool's pages.yml — same repo owner hosts several
# project pages this way, proxied together under h4md1.fr by infrastructure outside
# this repo. Keep the two workflows in sync if one changes.
#
# One step this workflow cannot do for you: on first use, go to
# Settings > Pages > Build and deployment > Source, and set it to "GitHub Actions".

name: Deploy demo site

on:
  push:
    branches:
      - main
    paths:
      - "demo/**"
      - ".github/workflows/gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The site is only ever the newest commit, so a queued run can be dropped — but
# never one that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stage the publishable demo files
        run: |
          mkdir -p _site
          rsync -a demo/ _site/
          # Without .nojekyll, Pages runs Jekyll and drops files starting "_".
          touch _site/.nojekyll
          echo "Publishing:"
          ls -A _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
